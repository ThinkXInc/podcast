# パス設定。data の置き場所。Google Drive運用なら同期フォルダを指す。
PODCAST_ROOT="$HERE/data"

# 文字起こし用の venv（whisperx を入れたもの）。
# 関連ファイルは作業ディレクトリ内に置く方針: プロジェクト直下の venv/ を使う。
# （$HERE = このプロジェクトのルート = config/ の1つ上）
VENV="$HERE/venv"

# Whisper 設定
# 方針: 速度より精度を優先する。モデルは large-v3 固定（turbo は使わない。turbo は
#       デコーダ4層の蒸留版で、固有名詞・専門用語の精度が large-v3 に劣る）。
#       量子化もしない（int8 は精度が落ちる。実測で fp32 と文字一致率 98.2%＝1.8%が劣化）。
#
# エンジン:
#   mlx      = mlx-whisper。mlx-community/whisper-large-v3-mlx は large-v3 の
#              **フル構成 fp16**（weights.npz 3.08GB / n_text_layer=32）。8bit量子化でも
#              turbo でもない。fp16 は Whisper 本来の推論精度（OpenAI 実装も GPU では fp16）。
#              Metal GPU で動くため 180秒音声を 39秒で処理（whisperx fp32 は 3分22秒）。
#   whisperx = CTranslate2 版。単語時刻を wav2vec2 の強制アラインで付け直す。
#              精度優先のため compute は float32（無量子化）を既定にする。
WHISPER_ENGINE="mlx"
WHISPER_MLX_MODEL="mlx-community/whisper-large-v3-mlx"
WHISPER_MODEL="large-v3"
WHISPER_DEVICE="cpu"
WHISPER_COMPUTE="float32"
WHISPER_LANG="ja"

# 長尺の分割文字起こし設定（実行環境のバックグラウンド時間上限を回避するため）。
# 1チャンクの音声長(秒)。実測 壁時計≈18.5+0.470×音声秒 なので、
# 12分(720秒)なら壁≈5.8分で、10分上限に安全に収まる。上限が違う環境は調整。
WHISPER_CHUNK_SEC="720"
# 隣接チャンクのオーバーラップ(秒)。境界の単語欠けを防ぐ。中点で重複排除する。
WHISPER_CHUNK_OVERLAP="6"
